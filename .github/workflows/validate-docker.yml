name: Validate Docker Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate runtime source
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test:contact
          npm run test:runtime

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate production image build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: stephenjoly-site:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify running standalone image
        run: |
          docker run -d --name runtime-check -p 127.0.0.1:3100:3000 stephenjoly-site:check
          for attempt in $(seq 1 30); do
            if docker exec runtime-check node -e "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
              break
            fi
            sleep 1
          done
          node scripts/verify-runtime.cjs http://127.0.0.1:3100

      - name: Remove validation container
        if: always()
        run: docker rm -f runtime-check || true
